# Deploy inotion-notes to Cloudflare Workers on every push to main.
#
# The liaison pushes code from the VM (LangTieu PAT); this workflow is the
# only deploy path. It gates on tests + typecheck + build, applies pending
# D1 migrations, then deploys with `npm run deploy` (build + wrangler deploy).
# Worker secrets (B2_*, ENCRYPTION_KEY, ALLOWED_EMAILS) already live on the
# Worker and are never needed here — only CLOUDFLARE_API_TOKEN, stored as a
# repository secret. Docs-only pushes do not trigger a deploy (paths filter).
name: Deploy inotion-notes

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'src/**'
      - 'migrations/**'
      - 'wrangler.jsonc'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'
      - 'tsconfig*.json'
      - 'vitest.config.*'
      - '.github/workflows/deploy.yml'

permissions:
  contents: read

concurrency:
  group: deploy-inotion-notes
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply inotion-notes --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy to Cloudflare Workers
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
